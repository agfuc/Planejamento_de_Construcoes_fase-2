<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Painel Planejamento Canoinhas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

<main class="login-wrap">
    <section class="admin-card login-card">
        <a href="../index.html" class="login-logo">
            <i class="ph ph-buildings"></i>
            <span>PLANEJAMENTO DE CONSTRUÇÕES CANOINHAS</span>
        </a>

        <h1>Painel administrativo</h1>
        <p class="login-sub">Entre com sua conta para gerenciar serviços, solicitações, notícias e eventos.</p>

        <!-- Mensagem de erro do login (ex.: senha incorreta) -->
        <div id="mensagem" class="admin-msg erro" role="alert" hidden></div>

        <form id="form-login" novalidate>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" placeholder="admin@planejamentocanoinhas.com.br" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-full" id="btn-entrar">
                <i class="ph ph-sign-in"></i> Entrar
            </button>
        </form>

        <a href="../index.html" class="login-voltar"><i class="ph ph-arrow-left"></i> Voltar ao site</a>
    </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
